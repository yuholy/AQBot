# AQBot Ollama Embedding Proxy
# 部署到 N100: /etc/nginx/sites-available/ollama-proxy
# 启用: ln -s /etc/nginx/sites-available/ollama-proxy /etc/nginx/sites-enabled/
# 验证: nginx -t && systemctl reload nginx

upstream ollama_backend {
    server 127.0.0.1:11434;
    keepalive 16;
}

server {
    listen 18080;           # 新端口，不影响 Ollama 直连
    server_name _;

    # 请求体限制（embedding 批量 chunk 可能较大）
    client_max_body_size 10m;
    client_body_timeout 120s;

    # 代理到 Ollama
    location / {
        proxy_pass http://ollama_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 关键：超时设置够大，bge-m3 冷启动可能要等
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # 关闭缓冲，流式响应直传
        proxy_buffering off;
    }
}
